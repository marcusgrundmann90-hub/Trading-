name: Big-Bets-App (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Site zusammenstellen
        run: |
          mkdir -p _site
          cp -R web/. _site/
          touch _site/.nojekyll
          # Service-Worker-Cache pro Commit erneuern, damit Handys Updates erhalten
          sed -i "s/^const VERSION = '.*';/const VERSION = '${GITHUB_SHA::12}';/" _site/sw.js
          grep -q "^const VERSION = '${GITHUB_SHA::12}';" _site/sw.js
          ls -la _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
